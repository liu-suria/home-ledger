<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf7f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Family Hub · 家庭事务中心 · Beta v2.2.1</title>
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/v2.css?v=9">
<style>
[hidden]{display:none!important}.startup{max-width:1180px;margin:auto;padding:10px 14px}.startup-row{height:56px;margin:6px 0;border:1px solid #eee5e8;border-radius:11px;background:#fff}.event{grid-template-columns:minmax(0,1fr) 66px 24px!important;gap:8px!important;padding:9px 9px 9px 12px!important;cursor:pointer;touch-action:pan-y;position:relative}.event:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:#ddd0d5}.event.urgent:before{background:#cf5d68}.event.soon:before{background:#dfa052}.event.done:before{background:#bcaeb3}.event-line b{font-size:13px}.meta{font-size:10px!important;margin-top:2px!important}.amount{display:inline-block!important;width:auto!important;margin-top:3px!important;padding:2px 6px!important;border-radius:6px;background:#f7f1f3;color:#715d65;font-size:10px!important;font-weight:600}.date{min-width:58px}.date strong{font-size:11px!important}.date small{font-size:9px!important}.done{opacity:.55}.done .event-line b{text-decoration:line-through}.swipe-moving .event-main,.swipe-moving .date,.swipe-moving .more{transform:translateX(var(--sx));transition:none}.save-state{position:fixed;left:50%;bottom:24px;z-index:100;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:#2f292c;color:#fff;font-size:12px}.load-error{max-width:520px;margin:80px auto;padding:20px;background:#fff;border:1px solid #eadfe3;border-radius:14px;display:grid;gap:10px}.empty{padding:36px 16px!important}.empty b{display:block;margin-bottom:6px}.primary[disabled]{opacity:.55;pointer-events:none}@media(max-width:720px){.event{grid-template-columns:minmax(0,1fr) 58px 22px!important;gap:6px!important}.event-line b{font-size:12.5px}.startup{padding:8px}}
</style>
</head>
<body>
<main id="app"><div class="startup"><div class="startup-row"></div><div class="startup-row"></div><div class="startup-row"></div></div></main>
<section id="login" class="login" hidden><div class="login-card"><h1>Family Hub</h1><p>家庭事务中心 · Beta v2.2.1</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required><button class="primary">进入家庭事务中心</button><small id="loginMessage"></small></form></div></section>
<dialog id="eventDialog"><form id="eventForm"></form></dialog>
<div id="toast" class="save-state" hidden></div>
<script>
(function(){
'use strict';
var VERSION='Beta v2.2.1',CACHE_KEY='family-hub-ledger-v221';
var db=emptyLedger(),filter='all',query='',editingId='',swipe=null,blockCardClick=false,saving=false,searchTimer=0;
var $=function(s,r){return(r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function emptyLedger(){return{version:5,updatedAt:null,settings:{siteName:'Family Hub'},events:[]}}
function esc(v){var e=document.createElement('i');e.textContent=v==null?'':String(v);return e.innerHTML}
function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function uid(){return'evt-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9)}
function dayDiff(v){if(!v)return 99999;return Math.round((new Date(v+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000)}
function fmt(v){return v?new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',weekday:'short'}).format(new Date(v+'T12:00:00')):'未设置'}
var labels={reminder:'事项',subscription:'订阅',warranty:'保修',maintenance:'维护',baby:'宝宝',document:'证件',vehicle:'车辆'};
var repeats={none:'单次',daily:'每天',weekly:'每周',monthly:'每月',quarterly:'每季度',yearly:'每年'};
async function request(url,opt){var r=await fetch(url,Object.assign({credentials:'same-origin',cache:'no-store'},opt||{}));var text=await r.text(),json={};try{json=text?JSON.parse(text):{}}catch(e){}if(!r.ok)throw new Error(json.error||('请求失败 '+r.status));return json}
function normalize(x){
  if(x&&Array.isArray(x.events)){x.version=5;x.settings=x.settings||{siteName:'Family Hub'};return x}
  return emptyLedger();
}
function writeCache(x){try{localStorage.setItem(CACHE_KEY,JSON.stringify({data:x,time:Date.now()}))}catch(e){}}
function readCache(){try{var x=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');return x&&x.data&&Array.isArray(x.data.events)?x.data:null}catch(e){return null}}
function toast(text){var el=$('#toast');el.textContent=text;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(function(){el.hidden=true},1800)}
function money(n,c){try{return new Intl.NumberFormat('zh-CN',{style:'currency',currency:c||'CNY',minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n||0))}catch(e){return(c||'CNY')+' '+Number(n||0).toFixed(2)}}
function amountText(x){return x.type==='subscription'&&x.amount!==null&&x.amount!==''&&Number.isFinite(Number(x.amount))?money(x.amount,String(x.currency||'CNY').toUpperCase()):''}
function visible(){return db.events.filter(function(x){if(x.archived)return false;if(filter==='done'&&x.status!=='done')return false;if(filter!=='all'&&filter!=='done'&&x.type!==filter&&x.category!==filter)return false;if(query&&[x.title,x.category,x.note,labels[x.type]].join(' ').toLowerCase().indexOf(query)<0)return false;return true}).sort(function(a,b){if((a.status==='done')!==(b.status==='done'))return a.status==='done'?1:-1;return String(a.date||'').localeCompare(String(b.date||''))})}
function groupName(d){var n=dayDiff(d);if(n<0)return'已逾期';if(n===0)return'今天';if(n===1)return'明天';if(n<=7)return'未来 7 天';if(n<=30)return'30 天内';if(n<=365)return'一年内';return'更远以后'}
function dateText(d){var n=dayDiff(d);if(n<0)return'逾期 '+Math.abs(n)+' 天';if(n===0)return'今天';if(n===1)return'明天';return n+' 天后'}
function card(x){var n=dayDiff(x.date),cls=x.status==='done'?' done':n<=0?' urgent':n<=3?' soon':'';return'<article class="event'+cls+'" data-id="'+esc(x.id)+'"><div class="event-main"><div class="event-line"><b>'+esc(x.title)+'</b><span class="badge">'+esc(x.category||labels[x.type]||'事项')+'</span></div><div class="meta">'+esc(labels[x.type]||'事项')+' · '+esc(repeats[x.repeat]||'单次')+(x.payment?' · '+esc(x.payment):'')+'</div>'+(amountText(x)?'<div class="amount">'+esc(amountText(x))+'</div>':'')+'</div><div class="date"><strong>'+dateText(x.date)+'</strong><small>'+fmt(x.date)+'</small></div><button class="more" data-action="menu">•••</button><div class="row-menu" hidden><button data-action="edit">编辑</button><button data-action="done">'+(x.status==='done'?'恢复':'完成')+'</button><button data-action="delay">延期 7 天</button><button data-action="delete" class="danger">删除</button></div></article>'}
function timeline(){var groups={};visible().forEach(function(x){var k=groupName(x.date);(groups[k]||(groups[k]=[])).push(x)});var order=['已逾期','今天','明天','未来 7 天','30 天内','一年内','更远以后'],html='';order.forEach(function(k){if(groups[k])html+='<section class="group"><div class="group-title"><b>'+k+'</b><span>'+groups[k].length+'</span></div><div class="events">'+groups[k].map(card).join('')+'</div></section>'});return html||'<div class="empty"><b>暂无事项</b><span>点击右上角“新增”开始记录。</span></div>'}
function chips(){var keys=['all','baby','subscription','maintenance','document','warranty','vehicle','reminder','done'],names={all:'全部',baby:'宝宝',subscription:'订阅',maintenance:'维护',document:'证件',warranty:'保修',vehicle:'车辆',reminder:'其他',done:'已完成'};return keys.map(function(k){return'<button class="chip'+(filter===k?' active':'')+'" data-filter="'+k+'">'+names[k]+'</button>'}).join('')}
function render(){document.title='Family Hub · 家庭事务中心 · '+VERSION;$('#app').innerHTML='<div class="shell"><header class="top"><div class="brand">Family Hub<small>家庭事务中心 · '+VERSION+'</small></div><button class="ghost compact" data-action="export">导出</button><button class="primary compact" data-action="new">＋ 新增</button></header><div class="controls"><div class="chips">'+chips()+'</div><div class="search"><input id="search" value="'+esc(query)+'" placeholder="搜索事项"><span>⌕</span></div></div><main class="timeline">'+timeline()+'</main></div>';$('#app').hidden=false}
function findItem(el){var cardEl=el&&el.closest?el.closest('.event'):null;return cardEl?db.events.find(function(x){return x.id===cardEl.dataset.id}):null}
async function save(){
  if(saving)return;
  saving=true;
  var previous=readCache()||JSON.parse(JSON.stringify(db));
  var snapshot=JSON.parse(JSON.stringify(db));
  snapshot.updatedAt=new Date().toISOString();
  toast('正在保存…');
  try{
    await request('/api/ledger',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(snapshot)});
    var remote=normalize(await request('/api/ledger?verify='+Date.now()));
    var remoteIds={};remote.events.forEach(function(x){remoteIds[x.id]=1});
    for(var i=0;i<snapshot.events.length;i++){if(!remoteIds[snapshot.events[i].id])throw new Error('保存后校验失败：记录缺失')}
    db=remote;writeCache(db);render();toast('已保存');
  }catch(err){
    db=previous;render();toast('保存失败');
    throw err;
  }finally{saving=false}
}
function field(label,name,value,type,full,attrs){return'<label class="field'+(full?' full':'')+'"><span>'+label+'</span><input name="'+name+'" type="'+(type||'text')+'" value="'+esc(value==null?'':value)+'" '+(attrs||'')+'></label>'}
function openForm(x){x=x||{};editingId=x.id||'';var f=$('#eventForm');f.innerHTML='<div class="modal"><header><h2>'+(editingId?'编辑事项':'新增事项')+'</h2><button type="button" class="close" data-close>×</button></header><div class="grid">'+field('事项标题','title',x.title,'text',true,'required')+'<label class="field"><span>类型</span><select name="type"><option value="reminder">一次性事项</option><option value="baby">宝宝事项</option><option value="subscription">订阅续费</option><option value="maintenance">家庭维护</option><option value="document">证件到期</option><option value="warranty">保修到期</option><option value="vehicle">车辆事项</option></select></label>'+field('分类','category',x.category||'家庭')+field('日期','date',x.date||today(),'date',false,'required')+'<label class="field"><span>重复</span><select name="repeat"><option value="none">不重复</option><option value="daily">每天</option><option value="weekly">每周</option><option value="monthly">每月</option><option value="quarterly">每季度</option><option value="yearly">每年</option></select></label>'+field('金额（可选）','amount',x.amount==null?'':Number(x.amount).toFixed(2),'number',false,'min="0" step="0.01" inputmode="decimal"')+field('币种','currency',x.currency||'CNY','text',false,'maxlength="8" autocapitalize="characters"')+field('支付方式','payment',x.payment||'')+'<label class="field full"><span>备注</span><textarea name="note">'+esc(x.note||'')+'</textarea></label></div><footer><button type="button" class="ghost" data-close>取消</button><button class="primary" type="submit">保存</button></footer></div>';f.elements.type.value=x.type||'reminder';f.elements.repeat.value=x.repeat||'none';var d=$('#eventDialog');if(typeof d.showModal==='function')d.showModal();else d.setAttribute('open','')}
function closeDialog(){var d=$('#eventDialog');if(typeof d.close==='function')d.close();else d.removeAttribute('open')}
document.addEventListener('click',function(e){
  if(e.target.closest('[data-close]')){e.preventDefault();closeDialog();return}
  var button=e.target.closest('button');
  if(!button){var cardEl=e.target.closest('.event');if(cardEl&&!blockCardClick)openForm(findItem(cardEl));return}
  var f=button.dataset.filter,a=button.dataset.action;
  if(f){filter=f;render();return}
  if(a==='new'){openForm();return}
  if(a==='export'){var l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));l.download='family-hub-v2.2.1.json';l.click();return}
  var x=findItem(button);if(!x)return;
  if(a==='menu'){$$('.row-menu').forEach(function(m){if(m!==button.nextElementSibling)m.hidden=true});button.nextElementSibling.hidden=!button.nextElementSibling.hidden;return}
  if(a==='edit'){openForm(x);return}
  if(a==='done'){x.status=x.status==='done'?'pending':'done';x.updatedAt=new Date().toISOString();save().catch(function(er){alert(er.message)});return}
  if(a==='delay'){var d=new Date((x.date||today())+'T12:00:00');d.setDate(d.getDate()+7);x.date=iso(d);x.updatedAt=new Date().toISOString();save().catch(function(er){alert(er.message)});return}
  if(a==='delete'&&confirm('确定删除“'+x.title+'”？')){db.events=db.events.filter(function(v){return v.id!==x.id});save().catch(function(er){alert(er.message)})}
});
document.addEventListener('input',function(e){
  if(e.target.id==='search'){clearTimeout(searchTimer);var value=e.target.value;searchTimer=setTimeout(function(){query=value.trim().toLowerCase();render()},120)}
  if(e.target.name==='currency')e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,'')
});
$('#eventForm').addEventListener('submit',async function(e){
  e.preventDefault();if(saving)return;
  var submit=e.currentTarget.querySelector('[type="submit"]');submit.disabled=true;
  var o={};new FormData(e.currentTarget).forEach(function(v,k){o[k]=v});
  o.amount=o.amount===''?null:Math.round(Number(o.amount)*100)/100;
  if(o.amount!==null&&!Number.isFinite(o.amount)){submit.disabled=false;alert('请输入正确金额');return}
  var now=new Date().toISOString(),old=editingId?db.events.find(function(x){return x.id===editingId}):null;
  if(old)Object.assign(old,o,{updatedAt:now});else db.events.push(Object.assign(o,{id:uid(),status:'pending',createdAt:now,updatedAt:now}));
  closeDialog();
  try{await save()}catch(er){alert('保存失败：'+er.message)}finally{submit.disabled=false}
});
document.addEventListener('touchstart',function(e){var c=e.target.closest('.event');if(!c||e.target.closest('button'))return;var p=e.touches[0];swipe={card:c,x:p.clientX,y:p.clientY,dx:0,moving:false}},{passive:true});
document.addEventListener('touchmove',function(e){if(!swipe)return;var p=e.touches[0],dx=p.clientX-swipe.x,dy=p.clientY-swipe.y;swipe.dx=dx;if(!swipe.moving&&Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy))swipe.moving=true;if(swipe.moving){e.preventDefault();swipe.card.classList.add('swipe-moving');swipe.card.style.setProperty('--sx',Math.max(-80,Math.min(80,dx))+'px')}},{passive:false});
document.addEventListener('touchend',function(){if(!swipe)return;var s=swipe;swipe=null;s.card.classList.remove('swipe-moving');s.card.style.removeProperty('--sx');if(s.moving&&Math.abs(s.dx)>=60){blockCardClick=true;var x=findItem(s.card);if(x){x.status=x.status==='done'?'pending':'done';x.updatedAt=new Date().toISOString();save().catch(function(er){alert(er.message)})}setTimeout(function(){blockCardClick=false},350)}},{passive:true});
async function boot(){
  var cachedData=readCache();if(cachedData){db=cachedData;render()}
  try{
    var session=await request('/api/auth/session');
    if(!session.authenticated){$('#app').hidden=true;$('#login').hidden=false;return}
    $('#login').hidden=true;
    db=normalize(await request('/api/ledger'));
    writeCache(db);render();
  }catch(e){
    if(!cachedData){$('#app').hidden=false;$('#app').innerHTML='<div class="load-error"><b>数据加载失败</b><span>'+esc(e.message)+'</span><button onclick="location.reload()">重新加载</button></div>'}
  }
}
$('#loginForm').addEventListener('submit',async function(e){e.preventDefault();var b=e.currentTarget.querySelector('button');b.disabled=true;$('#loginMessage').textContent='';try{await request('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});await boot()}catch(er){$('#loginMessage').textContent=er.message}finally{b.disabled=false}});
boot();
})();
</script>
</body>
</html>
