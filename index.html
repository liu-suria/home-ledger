<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fcf8f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>HomeLedger · 家庭账本</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/style.css?v=8" />
    <link rel="stylesheet" href="/overview.css?v=4" />
    <link rel="stylesheet" href="/quick-add.css?v=3" />
    <link rel="stylesheet" href="/subscription-display.css?v=1" />
  </head>
  <body>
    <div id="boot" class="boot">正在打开 HomeLedger…</div>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <main id="app" hidden>
      <header class="topbar">
        <a class="brand" href="/"
          ><i>H</i><span id="siteName">HomeLedger</span></a
        >
        <nav id="tabs"></nav>
        <a class="manage" href="/admin/">管理</a>
      </header>
      <section id="module"></section>
    </main>
    <section id="login" class="login" hidden>
      <div class="login-card">
        <i>H</i>
        <p>PRIVATE HOME LEDGER</p>
        <h1>你的家庭生活档案</h1>
        <span>输入密码后，查看账单、物品与提醒。</span>
        <form id="loginForm">
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="请输入密码"
            required
          /><button>进入 HomeLedger →</button><small id="loginMessage"></small>
        </form>
      </div>
    </section>
    <template id="empty"
      ><div class="empty">
        <b>⌁</b>
        <h2></h2>
        <p></p>
        <a href="/admin/">前往管理页</a>
      </div></template
    >
    <dialog id="quickAdd">
      <form id="quickAddForm">
        <button type="button" class="x" data-quick-close>×</button>
        <p>QUICK ADD</p>
        <h2 id="quickTitle"></h2>
        <div id="quickFields"></div>
        <footer>
          <button type="button" class="plain" data-quick-close>取消</button
          ><button class="save">保存</button>
        </footer>
      </form>
    </dialog>
    <dialog id="itemDetail">
      <section>
        <button type="button" class="x" data-detail-close aria-label="关闭">
          ×
        </button>
        <div id="detailContent"></div>
      </section>
    </dialog>
    <script>
      window.setTimeout(function () {
        var boot = document.getElementById("boot");
        if (boot && !boot.hidden)
          boot.innerHTML =
            "页面未能正常加载。请刷新一次；若仍然白屏，请升级 Safari 后重试。";
      }, 6000);
    </script>
    <script src="/compat.js?v=1"></script>
    <script type="module" src="/app.safari.js?v=7"></script>
  </body>
</html>
