unction bind(card){if(bound.has(card))return;bound.add(card);card.dataset.swipeLabel=card.classList.contains('done')?'恢复':'完成';var sx=0,sy=0,dx=0,moving=false;card.addEventListener('pointerdown',function(e){if(e.target.closest('button,.row-menu'))return;sx=e.clientX;sy=e.clientY;dx=0;moving=false});card.addEventListener('pointermove',function(e){if(!sx)return;dx=e.clientX-sx;var dy=e.clientY-sy;if(!moving&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy))moving=true;if(moving){e.preventDefault();var x=Math.max(-90,Math.min(90,dx));card.classList.add('swiping');card.style.setProperty('--swipe-x',x+'px');card.classList.toggle('swipe-ready',Math.abs(x)>=65)}});function end(){if(!sx)return;var toggle=moving&&Math.abs(dx)>=65;card.classList.remove('swiping','swipe-ready');card.style.removeProperty('--swipe-x');sx=0;if(toggle){blockClick=true;var check=card.querySelector('.check');if(check)check.click();setTimeout(function(){blockClick=false},350)}}card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);card.addEventListener('click',function(e){if(blockClick||e.target.closest('button,.row-menu'))return;var edit=card.querySelector('[data-action="edit"]');if(edit){e.preventDefault();e.stopPropagation();edit.click()}})}function refresh(){version();document.querySelectorAll('.event').forEach(bind)}new MutationObserver(refresh).observe(document.documentElement,{childList:true,subtree:true});document.addEventListener('DOMContentLoaded',refresh);setTimeout(refresh,0)})();</script></body></html>
